      "@type": "Question",
      "name": "What are the Sri Lanka personal income tax slabs for FY 2025/26?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For FY 2025/26, Sri Lanka uses these progressive slabs after a personal relief of LKR 1,800,000: First LKR 1,000,000 at 6%, next LKR 500,000 at 18%, next LKR 500,000 at 24%, next LKR 500,000 at 30%, and balance above LKR 4,300,000 at 36%."
      }
    },
    {
      "@type": "Question",
      "name": "What is the personal relief in Sri Lanka for FY 2025/26?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The personal relief (tax-free threshold) for resident individuals in Sri Lanka for FY 2025/26 is LKR 1,800,000 per year, or LKR 150,000 per month."
      }
    },
    {
      "@type": "Question",
      "name": "How is APIT calculated when I have multiple employers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each employer calculates APIT based only on the income they pay you, typically annualising each month's payment. This often results in over-withholding (refund due) or under-withholding (balance to pay) when you file your annual return. This calculator reconciles all sources to find your true tax liability."
      }
    },
    {
      "@type": "Question",
      "name": "Are reimbursable allowances taxable in Sri Lanka?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Genuine reimbursements against actual expense receipts (fuel, communication, entertainment, medical) are not taxable as they do not represent a gain to the employee. Fixed monthly cash allowances paid without expense receipts are taxable employment income under the Inland Revenue Act 2017."
      }
    },
    {
      "@type": "Question",
      "name": "Does this calculator save my data anywhere?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. All data is stored only in your browser's localStorage. Nothing is sent to any server. The entire calculator is a single HTML file that runs 100% client-side. View the source on GitHub to verify."
      }
    }
  ]

  Data saved locally to this browser — use Export to back up.
</div>

<input type="file" id="import-file" accept=".json" style="display:none">

<script>
const STORAGE_KEY = 'slTaxManager_v1';
const MONTHS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];

const SLABS = [
  { band: 1000000, rate: 0.06, label: 'First 1,000,000' },
  { band: 500000,  rate: 0.18, label: 'Next 500,000' },
  { band: 500000,  rate: 0.24, label: 'Next 500,000' },
  { band: 500000,  rate: 0.30, label: 'Next 500,000' },
  { band: Infinity, rate: 0.36, label: 'Balance' }
];

let state = {
  fyLabel: '2025/26',
  personalRelief: 1800000,
  sources: []
};

function uuid() { return 'src-' + Math.random().toString(36).slice(2, 11); }

function emptyMonths() {
  return Array.from({ length: 12 }, () => ({ income: 0, tax: 0 }));
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sources)) {
        state = normalizeState(parsed);
        return;
      }
    }
  } catch (e) { /* fall through to defaults */ }
  state = { fyLabel: '2025/26', personalRelief: 1800000, sources: [] };
  save();
}

function normalizeState(parsed) {
  const validTypes = ['employment', 'consultancy', 'interest', 'other'];
  return {
    fyLabel: String(parsed.fyLabel || '2025/26'),
    personalRelief: Number(parsed.personalRelief) || 1800000,
    sources: parsed.sources.map(s => ({
      id: s && s.id ? String(s.id) : uuid(),
      name: String(s && s.name || 'Unnamed'),
      type: validTypes.includes(s && s.type) ? s.type : 'other',
      taxWithheld: !!(s && s.taxWithheld),
      months: Array.isArray(s && s.months) && s.months.length === 12
        ? s.months.map(m => ({
            income: Number(m && m.income) || 0,
            tax:    Number(m && m.tax)    || 0
          }))
        : emptyMonths()
    }))
  };
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function fmt(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '0.00';
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtInt(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '0';
  return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

// Parse a user-entered numeric string. Strips commas and any non-numeric chars
// except digits, decimal point, and leading minus. Returns 0 for empty/invalid.
function parseNum(str) {
  if (typeof str === 'number') return isFinite(str) ? str : 0;
  if (str == null || str === '') return 0;
  const cleaned = String(str).replace(/,/g, '').replace(/[^\d.\-]/g, '');
  const n = Number(cleaned);
  return isFinite(n) ? n : 0;
}

// Format a number for display inside an input field. 0/empty → blank.
// Uses up to 2 decimal places, with thousand separators.
function fmtInput(n) {
  const num = parseNum(n);
  if (num === 0) return '';
  return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// Reformat an input field's value on blur.
function formatField(input) {
  input.value = fmtInput(input.value);
}

// Select all on focus so typing replaces the whole formatted value cleanly.
function focusSelect(input) {
  setTimeout(() => input.select(), 0);
}

// Live-format numeric strings: "400000" → "400,000". Preserves in-progress
// decimal entries like "100." and "1.5".
function fmtLiveString(str) {
  if (!str) return '';
  let s = String(str).replace(/,/g, '').replace(/[^\d.\-]/g, '');
  let negative = '';
  if (s.startsWith('-')) { negative = '-'; s = s.slice(1); }
  const dotIdx = s.indexOf('.');
  let intPart, decPart;
  if (dotIdx === -1) {
    intPart = s;
    decPart = '';
  } else {
    intPart = s.slice(0, dotIdx);
    decPart = '.' + s.slice(dotIdx + 1).replace(/\./g, '');
  }
  const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return negative + formattedInt + decPart;
}

// Reformat input value live while preserving cursor position.
function formatLive(input) {
  const oldValue = input.value;
  const cursorPos = input.selectionStart;

  // Count digit-like chars before cursor in OLD value
  let realCharsBefore = 0;
  for (let i = 0; i < cursorPos; i++) {
    if (/[\d.\-]/.test(oldValue[i])) realCharsBefore++;
  }

  const newValue = fmtLiveString(oldValue);
  if (newValue === oldValue) return;

  input.value = newValue;

  // Re-position cursor after the same number of digit-like chars in NEW value
  let newCursor = newValue.length;
  let count = 0;
  for (let i = 0; i < newValue.length; i++) {
    if (count >= realCharsBefore) { newCursor = i; break; }
    if (/[\d.\-]/.test(newValue[i])) count++;
  }
  input.setSelectionRange(newCursor, newCursor);
}

function calculateTax(taxable) {
  let remaining = Math.max(0, taxable);
  let totalTax = 0;
  const breakdown = [];
  for (const slab of SLABS) {
    const taxedInBand = Math.min(remaining, slab.band);
    const tax = taxedInBand * slab.rate;
    breakdown.push({ ...slab, taxable: taxedInBand, tax });
    totalTax += tax;
    remaining -= taxedInBand;
  }
  return { totalTax, breakdown };
}

function sourceTotals(s) {
  let income = 0, tax = 0;
  for (const m of s.months) {
    income += Number(m.income) || 0;
    if (s.taxWithheld) tax += Number(m.tax) || 0;
  }
  return { income, tax };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function findSource(id) { return state.sources.find(s => s.id === id); }

// ── Rendering ─────────────────────────────────────────────────────────────

function renderAll() {
  document.getElementById('fy-label').value = state.fyLabel;
  document.getElementById('fy-label-display').textContent = state.fyLabel;
  document.getElementById('personal-relief').value = fmtInput(state.personalRelief);
  renderSources();
  renderSummary();
  save();
}

function renderSources() {
  const container = document.getElementById('sources-container');
  if (state.sources.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </div>
        <h3>No income sources yet</h3>
        <p>Add your salaries, consultancy income, bank interest, and any other earnings for FY ${escapeHtml(state.fyLabel)}.</p>
        <button class="primary" onclick="addSource()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>Add your first source</span>
        </button>
      </div>
    `;
    return;
  }
  container.innerHTML = state.sources.map(renderSourceCard).join('');
}

function renderSourceCard(s) {
  const totals = sourceTotals(s);
  const showTax = !!s.taxWithheld;

  return `
    <div class="card source-card" data-id="${s.id}">
      <div class="source-card-head">
        <input class="name-input" type="text" value="${escapeHtml(s.name)}"
               oninput="onSourceNameChange('${s.id}', this.value)" placeholder="Source name">
        <select onchange="onSourceTypeChange('${s.id}', this.value)">
          <option value="employment"  ${s.type === 'employment'  ? 'selected' : ''}>Employment</option>
          <option value="consultancy" ${s.type === 'consultancy' ? 'selected' : ''}>Consultancy</option>
          <option value="interest"    ${s.type === 'interest'    ? 'selected' : ''}>Interest</option>
          <option value="other"       ${s.type === 'other'       ? 'selected' : ''}>Other</option>
        </select>
        <label class="checkbox-label">
          <input type="checkbox" ${showTax ? 'checked' : ''}
                 onchange="onTaxWithheldToggle('${s.id}', this.checked)">
          Tax withheld at source
        </label>
        <button class="danger small icon-only" onclick="removeSource('${s.id}')" title="Remove source" aria-label="Remove source">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        </button>
      </div>

      <div class="bulk-fill">
        <span class="label">Bulk-fill income:</span>
        <input type="text" inputmode="decimal" placeholder="Amount" id="bulk-income-${s.id}"
               onfocus="focusSelect(this)" onblur="formatField(this)">
        <button class="small" onclick="bulkFill('${s.id}', 'income')">
          <span>Apply to all</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="bulk-fill tax-bulk-${s.id} ${showTax ? '' : 'hidden'}">
        <span class="label">Bulk-fill tax withheld:</span>
        <input type="text" inputmode="decimal" placeholder="Amount" id="bulk-tax-${s.id}"
               onfocus="focusSelect(this)" onblur="formatField(this)">
        <button class="small" onclick="bulkFill('${s.id}', 'tax')">
          <span>Apply to all</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="month-grid-wrap">
        <table class="month-grid">
          <thead>
            <tr>
              <th class="row-header"></th>
              ${MONTHS.map(m => `<th>${m}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="row-header">Income</td>
              ${s.months.map((m, i) => `
                <td><input type="text" inputmode="decimal" value="${fmtInput(m.income)}"
                           oninput="onMonthChange('${s.id}', ${i}, 'income', this.value)"
                           onfocus="focusSelect(this)" onblur="formatField(this)"></td>
              `).join('')}
            </tr>
            <tr class="tax-row tax-row-${s.id} ${showTax ? '' : 'hidden'}">
              <td class="row-header">Tax withheld</td>
              ${s.months.map((m, i) => `
                <td><input type="text" inputmode="decimal" value="${fmtInput(m.tax)}"
                           oninput="onMonthChange('${s.id}', ${i}, 'tax', this.value)"
                           onfocus="focusSelect(this)" onblur="formatField(this)"></td>
              `).join('')}
            </tr>
          </tbody>
        </table>
      </div>

      <div class="source-subtotal" id="subtotal-${s.id}">
        ${renderSubtotalInner(s)}
      </div>
    </div>
  `;
}

function renderSubtotalInner(s) {
  const totals = sourceTotals(s);
  let html = `<div><span class="field-label">Total Income:</span><span class="field-value">LKR ${fmt(totals.income)}</span></div>`;
  if (s.taxWithheld) {
    html += `<div><span class="field-label">Total Tax Withheld:</span><span class="field-value">LKR ${fmt(totals.tax)}</span></div>`;
  }
  return html;
}

function renderSummary() {
  // First pass: collect totals
  const sourceData = state.sources.map(s => {
    const t = sourceTotals(s);
    return { source: s, income: t.income, withheld: t.tax };
  });

  const totalIncome = sourceData.reduce((acc, d) => acc + d.income, 0);
  const totalTaxWithheld = sourceData.reduce((acc, d) => acc + d.withheld, 0);

  // Income & Tax Deducted
  renderIncomeBreakdown(sourceData, totalIncome, totalTaxWithheld);

  const relief = Number(state.personalRelief) || 0;
  const taxable = Math.max(0, totalIncome - relief);
  const { totalTax, breakdown } = calculateTax(taxable);

  const slabRows = breakdown.map(b => `
    <tr class="${b.taxable === 0 ? 'unused' : ''}">
      <td>${b.label}</td>
      <td class="num">${(b.rate * 100).toFixed(0)}%</td>
      <td class="num">${fmt(b.taxable)}</td>
      <td class="num">${fmt(b.tax)}</td>
    </tr>
  `).join('');

  const effectiveRate = totalIncome > 0 ? (totalTax / totalIncome) * 100 : 0;

  document.getElementById('slab-breakdown').innerHTML = `
    <div class="summary-row muted"><span>Total Income</span><span>${fmt(totalIncome)}</span></div>
    <div class="summary-row muted"><span>Less: Personal Relief</span><span>− ${fmt(relief)}</span></div>
    <div class="summary-row bold divider"><span>Taxable Income</span><span>LKR ${fmt(taxable)}</span></div>
    <table class="slab-table" style="margin-top:14px">
      <thead>
        <tr><th>Band</th><th class="num">Rate</th><th class="num">Taxable</th><th class="num">Tax</th></tr>
      </thead>
      <tbody>
        ${slabRows}
        <tr class="total">
          <td colspan="3">Total Tax Payable</td>
          <td class="num">${fmt(totalTax)}</td>
        </tr>
      </tbody>
    </table>
    <div class="summary-row muted" style="margin-top:10px;font-size:12px">
      <span>Effective rate (tax ÷ total income)</span>
      <span>${effectiveRate.toFixed(2)}%</span>
    </div>
  `;

  const balance = totalTax - totalTaxWithheld;
  const isRefund = balance < -0.005;
  const isSettled = Math.abs(balance) < 0.005;

  let grandLabel, grandClass;
  if (isRefund) {
    grandLabel = 'Refund Due';
    grandClass = 'refund';
  } else if (isSettled) {
    grandLabel = 'Settled';
    grandClass = 'refund';
  } else {
    grandLabel = 'Balance Tax to Pay';
    grandClass = '';
  }

  document.getElementById('reconciliation').innerHTML = `
    <div class="summary-row"><span>Tax Payable</span><span>${fmt(totalTax)}</span></div>
    <div class="summary-row muted"><span>Less: Tax Withheld at Source</span><span>− ${fmt(totalTaxWithheld)}</span></div>
    <div class="grand-total ${grandClass}">
      <span class="label">${grandLabel}</span>
      <span>LKR ${fmt(Math.abs(balance))}</span>
    </div>
  `;
}

function renderIncomeBreakdown(sourceData, totalIncome, totalTaxWithheld) {
  const container = document.getElementById('income-breakdown');

  if (sourceData.length === 0) {
    container.innerHTML = '<div class="summary-row muted"><span>No sources added yet</span></div>';
    return;
  }

  const rows = sourceData.map(d => `
    <tr>
      <td>
        <div class="src-name">
          <span class="badge ${d.source.type}">${d.source.type}</span>
          <span class="nm">${escapeHtml(d.source.name)}</span>
        </div>
      </td>
      <td class="num">${fmt(d.income)}</td>
      <td class="num">${fmt(d.withheld)}</td>
    </tr>
  `).join('');

  container.innerHTML = `
    <div class="per-source-table-wrap">
    <table class="per-source-table">
      <thead>
        <tr>
          <th>Source</th>
          <th class="num">Income</th>
          <th class="num">Tax Deducted</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr class="totals">
          <td>Total</td>
          <td class="num">${fmt(totalIncome)}</td>
          <td class="num">${fmt(totalTaxWithheld)}</td>
        </tr>
      </tbody>
    </table>
    </div>
  `;
}

function updateSubtotal(id) {
  const s = findSource(id); if (!s) return;
  const el = document.getElementById('subtotal-' + id);
  if (el) el.innerHTML = renderSubtotalInner(s);
}

// ── Event handlers ────────────────────────────────────────────────────────

function onSourceNameChange(id, val) {
  const s = findSource(id); if (!s) return;
  s.name = val;
  save();
  renderSummary();
}

function onSourceTypeChange(id, val) {
  const s = findSource(id); if (!s) return;
  s.type = val;
  save();
  renderSummary();
}

function onTaxWithheldToggle(id, checked) {
  const s = findSource(id); if (!s) return;
  s.taxWithheld = checked;
  // Surgical: toggle tax row and bulk-fill visibility, update subtotal, update summary
  document.querySelectorAll(`.tax-row-${id}, .tax-bulk-${id}`).forEach(el => {
    el.classList.toggle('hidden', !checked);
  });
  updateSubtotal(id);
  save();
  renderSummary();
}

function onMonthChange(id, monthIdx, field, val) {
  const s = findSource(id); if (!s) return;
  s.months[monthIdx][field] = parseNum(val);
  updateSubtotal(id);
  save();
  renderSummary();
}

function bulkFill(id, field) {
  const s = findSource(id); if (!s) return;
  const input = document.getElementById(`bulk-${field}-${id}`);
  const val = parseNum(input.value);
  for (const m of s.months) m[field] = val;
  renderAll();
}

function addSource() {
  state.sources.push({
    id: uuid(),
    name: 'New Source',
    type: 'employment',
    taxWithheld: false,
    months: emptyMonths()
  });
  renderAll();
}

function removeSource(id) {
  const s = findSource(id);
  if (!s) return;
  if (!confirm(`Remove "${s.name}"?`)) return;
  state.sources = state.sources.filter(x => x.id !== id);
  renderAll();
}

function clearAll() {
  if (state.sources.length === 0) return;
  if (!confirm('Clear ALL data? This cannot be undone (unless you re-import a backup).')) return;
  state = { fyLabel: state.fyLabel, personalRelief: state.personalRelief, sources: [] };
  renderAll();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sl-tax-fy-${state.fyLabel.replace('/', '-')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importJSON() {
  document.getElementById('import-file').click();
}

// ── Init ──────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  load();
  renderAll();

  // Global live-formatter — adds commas as you type in any numeric input.
  // Uses capture phase so it runs BEFORE inline oninput handlers, ensuring
  // the value passed to parseNum() is already formatted (parseNum strips commas).
  document.addEventListener('input', (e) => {
    if (e.target && e.target.matches && e.target.matches('input[inputmode="decimal"]')) {
      formatLive(e.target);
    }
  }, true);

  document.getElementById('fy-label').addEventListener('input', e => {
    state.fyLabel = e.target.value;
    document.getElementById('fy-label-display').textContent = e.target.value;
    save();
  });

  const reliefInput = document.getElementById('personal-relief');
  reliefInput.addEventListener('input', e => {
    state.personalRelief = parseNum(e.target.value);
    save();
    renderSummary();
  });
  reliefInput.addEventListener('blur', e => formatField(e.target));

  document.getElementById('import-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.sources || !Array.isArray(parsed.sources)) throw new Error('No sources array');
        state = normalizeState(parsed);
        renderAll();
      } catch (err) {
        alert('Failed to import: ' + err.message);
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
});
</script>
</body>
</html>
